services:
  - type: web
    name: m2m-seller
    runtime: python
    plan: free
    buildCommand: "echo ok"
    startCommand: "python seller.py"
    envVars:
      - key: M2M_PORT
        value: 8001
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: M2M_PAYOUT
        sync: false
      - key: M2M_PAYOUT_THRESHOLD
        value: 10.0
