services:
  - type: web
    name: m2m-seller
    runtime: python
    plan: free
    buildCommand: "echo ok"
    startCommand: "python seller.py"
    healthCheckPath: /status
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: M2M_PAYOUT
        sync: false
      - key: M2M_PAYOUT_THRESHOLD
        value: 10.0
